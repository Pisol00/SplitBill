services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: splitbill
      POSTGRES_PASSWORD: splitbill
      POSTGRES_DB: splitbill
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitbill -d splitbill"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
