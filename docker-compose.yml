# Everything at once: docker compose up --build
# Only the database, for local development: docker compose up -d --wait db

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: splitbill
      POSTGRES_PASSWORD: splitbill
      POSTGRES_DB: splitbill
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitbill -d splitbill"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies migrations and seed data, then exits.
  migrate:
    build: ./backend
    image: splitbill-backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://splitbill:splitbill@db:5432/splitbill
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: splitbill-backend
    environment:
      DATABASE_URL: postgresql+psycopg://splitbill:splitbill@db:5432/splitbill
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
